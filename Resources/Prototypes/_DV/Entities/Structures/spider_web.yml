- type: entity
  parent: SpiderWeb
  id: SpiderWebTerrorSpider
  abstract: true
  name: terror spider web
  components:
  - type: Flammable
    fireSpread: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviours:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: SpiderWebTerrorSpider
  id: SpiderWebReinforced
  name: reinforced web
  description: This web is reinforced with extra strands, for added strength.
  components:
  - type: Sprite
    color: "#686868ff"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviours:
      - !type:DoActsBehavior
        acts: ["Destructions"]

- type: entity
  parent: SpiderWebTerrorSpider
  id: SpiderWebStealth
  name: transparent web
  # TODO make web actually partially transparent
  description: This web is partially transparent, making it harder to see, and easier to get caught by.
  components:
  - type: Sprite
    color: "#a3a3ff88"
  - type: Tag
    tags:
    - GreyTerrorSpiderStealth
